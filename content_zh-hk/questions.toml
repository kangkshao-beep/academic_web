[[items]]
id = "data-structure-before-physics-computation"
date = "2026-06-08"
question = "對於理論物理中的大型計算項目，為什麼有必要先花時間整理數據結構，而不是立刻推進物理計算？"
context = "大型計算項目的風險往往不只來自公式本身，也來自數據組織、接口約定和中間結果的可追蹤性。"
answer = "先花一天把數據結構理順，再花十天做物理，第十一天仍在做物理，而不是 debug。"
answerDate = "2026-06-08"
tags = ["理論計算", "數據結構", "調試成本", "項目工作流"]

