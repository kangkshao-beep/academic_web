type = "gallery"
title = "攝影"
description = "這裏展示的是一組經過打散順序的精選照片，並在能夠確認時補充拍攝時間與器材信息。"

[[items]]
id = "freshers-night"
thumb = "/photography/thumbs/freshers-night.jpg"
image = "/photography/full/freshers-night.jpg"
title = "新程之夜"
date = "2026-08-29"
location = "華中科技大學，武漢"
camera = "Sony ILCE-6400"
alt = "夜色中的華中科技大學迎新展板，後方是一座被燈光照亮的雕像。"
description = """新生把名字放進夜風，旗幟卻先替明天舉手。校門外的路還未熟，腳步已學會把陌生唱成同行。"""
details = """畫面把迎新展板放在近處，並以一條向上傾斜的橙色邊框切入畫幅，先建立了明確的行動方向。上方被燈光打亮的雕像，以垂直的身姿和抬起的手構成莊重的視覺支點；其後的樓宇、樹影和夜色則退成深暗的背景。紫藍色展板與橙色框架之間形成清醒的冷暖對照，白色雕像又把目光重新提向高處。

於是這不只是迎新現場的記錄：前景的文字、遠處的人像和空出的夜空，將剛剛啟程的興奮安放進秩序感很強的校園空間。畫面同時保留了現場的熱鬧與夜晚的安靜，讓「新程」成為一條由近到遠、由低到高展開的視覺路線。"""

[[items]]
id = "jianghan-guan-night"
thumb = "/photography/thumbs/jianghan-guan-night.jpg"
image = "/photography/full/jianghan-guan-night.jpg"
title = "江漢關的藍光"
date = "2026-08-29"
location = "江漢關，武漢"
camera = "Sony ILCE-6400"
alt = "夜色中的江漢關鐘樓，背景是藍色燈光勾勒的高樓。"
description = """鐘面替江城守夜，藍光把高樓寫成未寄出的信。若時間肯回頭一秒，誰會在鐘聲裏認出舊的自己。"""
details = """低機位讓鐘樓從畫面左側向上生長，古典建築厚重的石材、拱券與發光鐘面，被置於高樓的藍色線性燈光之前。兩種垂直節奏彼此呼應：鐘樓的輪廓穩而緩，背後建築的藍光則更鋒利、更密集。畫面右側保留了大塊近乎純黑的夜空，使明亮主體不至於擁擠，也讓時間感有了停頓的餘地。

金色與藍色並置得很克制，既提示出城市新舊尺度的並存，也讓這座鐘樓在夜裏顯得像一枚安靜、清晰的座標。鐘面本身是最直接的亮點，而周圍向上延伸的燈帶則把視線繼續推往更高處，使歷史建築和當代天際線共享同一段夜色。"""

[[items]]
id = "corridor-afterglow"
thumb = "/photography/thumbs/corridor-afterglow.jpg"
image = "/photography/full/corridor-afterglow.jpg"
title = "走廊留住餘暉"
date = "2026-08-25"
location = "華中科技大學物理學院，武漢"
camera = "Sony ILCE-6400"
alt = "低機位拍攝的昏暗室內走廊，盡頭的玻璃門映出陽光和樹影，地面有清晰倒影。"
description = """走廊把黃昏收進地面，門外的樹影還未肯散場。我在倒影裏借一盞光，照見今天沒有說完的話。"""
details = """這張直幅將走廊的縱深壓得很長：頂棚、兩側牆面和欄杆不斷向盡頭收束，把視線準確地送往玻璃門後的光。室內維持低照度，門外的夕陽卻透過玻璃、綠葉與朦朧反光層層漫開，形成溫暖而不刺目的中心。地面的倒影幾乎複製了門窗的結構，使畫面像多出一段向下延伸的空間。

暗處的門框、座椅和日常物件保留了環境的質地，避免了畫面滑向單純的光影練習。冷靜的室內秩序與門外流動的金色相遇，讓空無一人的走廊仍帶着剛剛有人經過般的溫度；光被框在門後，卻又藉由倒影慢慢鋪回觀看者腳下。"""

[[items]]
id = "suspension-bridge-twilight"
thumb = "/photography/thumbs/suspension-bridge-twilight.jpg"
image = "/photography/full/suspension-bridge-twilight.jpg"
title = "暮色懸江"
date = "2026-07-05"
location = "武昌灣公園，武漢 · 楊泗港長江大橋"
camera = "Sony ILCE-6400"
lens = "Sony E 18-135mm F3.5-5.6 OSS"
alt = "晚霞中的紅色懸索橋橋塔，前景有虛化的花朵，遠處是江對岸的高樓。"
description = """橋塔把晚霞吊在半空，遠樓把沉默站成彼岸。河風經過，城市便把一天慢慢收線。"""
details = """橋塔被置於畫面偏左的位置，垂直的結構與兩側舒展的懸索共同搭起清晰骨架；細密的吊索反覆劃過晚霞，使天空不只是背景，也成為節奏的一部分。前景虛化的花朵沒有搶佔主體，卻像一層柔軟的帷幕，給鋼鐵結構加入了近距離的呼吸。

粉橙色雲層、橋身的暖紅與遠處漸暗的城市剪影逐層遞進，水面把橋塔和樓群再次壓低、拉長。畫面因此同時擁有工程結構的力量和黃昏的輕盈，情緒並不熱烈，卻有一種城市將要慢慢安靜下來的從容。"""

[[items]]
id = "bridges-across-river"
thumb = "/photography/thumbs/bridges-across-river.jpg"
image = "/photography/full/bridges-across-river.jpg"
title = "重橋望城"
date = "2026-07-05"
location = "武昌灣公園，武漢 · 楊泗港長江大橋"
camera = "Sony ILCE-6400"
lens = "Sony E 18-135mm F3.5-5.6 OSS"
alt = "兩座橋橫跨寬闊江面，遠處城市高樓的玻璃窗映出暖色陽光。"
description = """兩道橋把江面分成前後，夕陽在遠樓的玻璃裏留下短暫的金。我們隔着鋼索望向彼此，像把重逢排練成遠景。"""
details = """這張照片沒有把單一橋樑作為絕對主角，而是用多重水平結構組織遼闊的江面。上方懸索的弧線斜跨天空，中部的橋面承接車輛與行人的細小節奏，下方另一座橋又把城市天際線切出新的層次；水面則為這些線條留出安靜的呼吸空間。

遠處高樓的玻璃反射出一小片金光，成為偏冷、偏灰畫面裏最精確的亮點。不同高度、不同尺度的橋和樓彼此疊合，照片呈現的不是熱鬧的城市全景，而是一段被交通、河流與光線共同編排的空間關係。"""

[[items]]
id = "sunset-behind-railings"
thumb = "/photography/thumbs/sunset-behind-railings.jpg"
image = "/photography/full/sunset-behind-railings.jpg"
title = "欄杆後的落日"
date = "2026-07-05"
camera = "Sony ILCE-6400"
lens = "Sony E 18-135mm F3.5-5.6 OSS"
alt = "橫向欄杆後的落日和城市天際線，前景有逆光的玫瑰。"
description = """欄杆把日落切成幾段，玫瑰在陰影裏仍學着發亮。城市不肯停下，卻容許一朵花把傍晚留住。"""
details = """橫向欄杆在這裏並非單純的遮擋，而是主動的畫面語言。它們將天空、城市和水面切成數個平行的層次，使低處的玫瑰與遠處的樓群被納入同一套節奏。逆光中的太陽接近畫面中央，強烈的白光壓低了建築細節，卻把欄杆、花枝和地面投下的陰影勾得更清楚。

暖光從縫隙間穿出，既有被限制的意味，也讓平常的城市邊界顯得格外有戲劇性。花朵在前景保持柔軟，遠景則趨於剪影，畫面最終留下的是短暫、明亮而略帶阻隔感的傍晚。"""

[[items]]
id = "rose-before-sunset"
thumb = "/photography/thumbs/rose-before-sunset.jpg"
image = "/photography/full/rose-before-sunset.jpg"
title = "暮色留花"
date = "2026-07-05"
location = "武昌灣公園，武漢"
camera = "Sony ILCE-6400"
lens = "Sony E 18-135mm F3.5-5.6 OSS"
alt = "欄杆邊的一朵蜜桃色玫瑰，背景是虛化的低陽和城市天際線。"
description = """日光越過欄杆時，玫瑰替天空保管最後一點紅。遠樓沒有回答，風已把花瓣寫成告別。"""
details = """這張作品將一朵玫瑰安放在右下角，讓它面對大面積被逆光洗亮的天空與模糊城市。畫面主體並不只在花上，而在花、欄杆與光之間形成的尺度反差：近處的花瓣保留了溫暖的邊緣，遠處樓群卻被壓成柔和的深色塊，橫向欄杆從中穿過，替畫面建立起穩定的節拍。

高亮區域幾乎吞沒了天空的細節，卻讓光線具有一種接近記憶的朦朧感。於是玫瑰不顯得孤立，反而像是在繁複城市之前留下的一點近景情緒，輕而不弱；欄杆的重複線條也讓這種細小的情緒有了可以停靠的結構。"""

[[items]]
id = "bay-after-dark"
thumb = "/photography/thumbs/bay-after-dark.jpg"
image = "/photography/full/bay-after-dark.jpg"
title = "燈灣"
date = "2026-07-02"
location = "煙台漁人碼頭，煙台"
camera = "Sony ILCE-6400"
lens = "Sony E 18-135mm F3.5-5.6 OSS"
alt = "藍調時刻的弧形海濱步道，欄杆亮起燈光，遠處海灣和建築燈火相映。"
description = """夜色沿海灣慢慢合攏，燈光在石岸排成一條回家的線。我們不說再見，只讓潮聲替城市繼續說下去。"""
details = """弧形步道從右下方出發，沿着海岸把視線帶向遠處亮起燈火的建築群，是畫面最明確的引導線。左側海面保持深暗而開闊，右側的欄杆、步道和樹影則不斷收緊空間，兩者共同形成開與合的平衡。岸線燈光被連續地拉成暖色曲線，與仍帶藍意的天空和水面相互映照。

零星行人的尺度讓長長的步道不顯空置，建築的尖頂與遠處高樓在夜色中起伏。照片既有散步時的親近感，也保留了海灣面對城市時的遼闊；光線沿岸延伸，像把觀看者緩慢帶進畫面深處。"""

[[items]]
id = "harbor-lights"
thumb = "/photography/thumbs/harbor-lights.jpg"
image = "/photography/full/harbor-lights.jpg"
title = "海岸燈火"
date = "2026-07-02"
camera = "Sony ILCE-6400"
lens = "Sony E 18-135mm F3.5-5.6 OSS"
alt = "藍調時刻水邊一組亮燈的尖頂建築，海面映出淡淡的燈光。"
description = """屋頂像未讀完的童話，燈火把海面叫醒。當藍色降到最低，我們把遠方誤認成一盞門燈。"""
details = """建築群被安排在畫面中下部，密集的尖頂、屋脊和窗燈組成起伏而清晰的輪廓；深藍色天幕留出足夠空間，使燈火顯得更集中。海岸邊一條連續的暖光帶橫向展開，將建築、水面和前景的暗色礁石連接起來。

水中的倒影沒有被處理得過分平滑，而是隨着水面微小起伏被拉開、打散，為靜止的建築添入柔和的流動。冷色夜幕與金色燈光之間保持着克制的距離，畫面因此不像單純的夜景陳列，更像一段由岸線、波光與屋頂共同構成的安靜舞台。"""

[[items]]
id = "seawall-blue-hour"
thumb = "/photography/thumbs/seawall-blue-hour.jpg"
image = "/photography/full/seawall-blue-hour.jpg"
title = "岸燈未眠"
date = "2026-07-02"
location = "煙台海岸線，煙台"
camera = "Sony ILCE-6400"
lens = "Sony E 18-135mm F3.5-5.6 OSS"
alt = "藍調時刻的石砌海堤，人們站在暖色燈光照亮的欄杆旁，遠處可見對岸。"
description = """石牆把海風擋在身後，金色在邊緣替暮色點燈。有人停在欄邊，像等一個名字從浪裏回來。"""
details = """直幅構圖把大片天空和海面交給冷藍色，石砌海堤則從右下方斜向伸出，成為連接近處礁石、欄杆與遠方岸線的主要力量。堤岸粗糲的石塊、潮濕的礁石與欄杆上細密的暖光形成質感對照：前者沉穩而有重量，後者輕而連續，像沿邊緣緩慢移動的光線。

欄邊的人物被壓縮得很小，卻恰好給出尺度，使空闊海面不顯空洞。遠處城市在薄霧中變得模糊，畫面最動人的地方正在於這種邊界感：陸地尚未結束，夜色卻已經從海上先一步抵達。"""

[[items]]
id = "misty-shore"
thumb = "/photography/thumbs/misty-shore.jpg"
image = "/photography/full/misty-shore.jpg"
title = "霧岸"
date = "2026-07-02"
location = "煙台大學，煙台"
camera = "Sony ILCE-6400"
lens = "Sony E 18-135mm F3.5-5.6 OSS"
alt = "一名持傘者站在海水邊緣，面向有霧的海面，遠處隱約可見海上建築。"
description = """霧把遠岸藏得太好，海卻替每個離開的人保留波紋。一把傘站在浪前，像不肯說破的等候。"""
details = """這張直幅以極大的留白建立情緒。天空、霧氣與海面幾乎連成同一層低飽和的藍灰，地平線被弱化，遠處的平台與船隻只留下若隱若現的輪廓。人物被放在畫面右下方的淺水邊緣，傘面和深色衣裙成為整幅照片最明確、也最安靜的視覺錨點。

她與遼闊水面之間沒有戲劇性的動作，正因如此，尺度差距顯得格外真實：近處是一人、一把傘和細小波紋，遠處則是難以辨清的海。畫面把霧的遮蔽轉化為一種溫和的沉默，讓觀看停留得更久。"""

[[items]]
id = "wuchang-bay-blue-hour"
thumb = "/photography/thumbs/dsc00113.jpg"
image = "/photography/full/dsc00113.jpg"
title = "武昌灣藍調"
date = "2026-06-19"
location = "武昌灣公園，武漢"
camera = "Sony ILCE-6400"
lens = "導出 JPEG 未保留鏡頭 EXIF"
alt = "藍調夜色中，鸚鵡洲長江大橋亮起橙金燈光，江面映出城市燈火，前景有暗色樹葉。"
description = """這張照片的層次鋪陳十分清晰：近處的樹葉以近乎剪影的方式壓入畫面，像一層安靜的前景帷幕；中景的鸚鵡洲長江大橋則以温暖的燈光橫貫江面，成為畫面的視覺骨架；更遠處，另一座橋與城市天際線隱入深藍的夜色之中，使空間被自然地拉開。畫面因此不是平鋪的夜景，而是由前景、中景、遠景共同構成的一種有縱深的舞台。

最動人的地方在於冷暖關係的剋制。藍調時刻已接近尾聲，天空與江面都沉入深而靜的冷藍色之中，而橋塔和橋身的橙金色燈光恰好在其中點亮一條温暖的脈絡。這種冷暖對比並不激烈，卻很有呼吸感：暖色沒有撕破夜色，冷色也沒有吞沒城市，二者在江面上達到一種含蓄的平衡。

水面的倒影尤其豐富。橋燈、塔身與城市燈火被江水拉長、揉碎，形成細密而流動的光紋，為畫面增加了柔軟的節奏。但這些倒影並不喧賓奪主，它們只是讓靜止的橋與城市擁有了水的回聲，使整個畫面在沉靜中帶着微微的流動感。

遠處的城市天際線和天邊幾朵雲彩，則給這片深藍色的夜景留下了明亮而透氣的出口。它們讓畫面不至於過分沉重，也使視覺重心從橋樑延展到更遼闊的城市空間。整體來看，這張照片既有藍調末期的深沉，也有江城夜色特有的温柔光澤：它不是熱鬧的城市明信片，而是一幅安靜、剋制、層次分明的江面夜景。"""

