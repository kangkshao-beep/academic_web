[[items]]
title = "半輕子單舉粲衰變"
subtitle = "解析結構、衰變寬度與電子能量矩"
date = "當前"
content = "我目前最主要的工作是研究半輕子單舉粲衰變。我關心的是如何在足夠可控的解析框架下得到衰變寬度和更高階電子能量矩，並進一步為唯象分析提供可靠輸入。\n\n這一方向同時涉及解析推導、數據處理以及與實驗觀測量的比較，其更大的目標是通過數據約束 HQET 中的非微擾參數。"
tags = ["粲衰變", "重味物理", "電子能量矩"]

[[items]]
title = "HQET、OPE 與非微擾參數"
subtitle = "重味唯象中的有效場論工具"
date = "當前"
content = "重夸克有效理論（HQET）和算符乘積展開（OPE）是我研究中的核心工具。我使用這些方法組織高維算符效應、構建受控近似，並研究非微擾參數如何通過數據得到約束。\n\n我特別關注的是：形式化結果如何真正變成可用於唯象的表達式，尤其是在單舉粲衰變的數據驅動研究中。"
tags = ["HQET", "OPE", "非微擾物理"]

[[items]]
title = "beauty-charmed 重子與弱湮滅衰變"
subtitle = "壽命結構與重重子衰變道研究"
date = "前期工作與延續基礎"
content = "我的第二條研究線來自本科畢業論文，主要關注 beauty-charmed 重子的弱湮滅衰變及壽命問題。通過 HDET 和 OPE，我研究了相關衰變道以及混合角與衰變寬度之間的關係，尤其是 \\(\\Xi_{bc} \\to X_{cs}\\) 通道。\n\n這部分工作構成了我理解有效場論如何應用到具體衰變過程中的重要基礎。"
tags = ["beauty-charmed 重子", "弱湮滅", "HDET"]
