type = "gallery"
title = "摄影"
description = "这里展示的是一组经过打散顺序的精选照片，并在能够确认时补充拍摄时间与器材信息。"

[[items]]
id = "freshers-night"
thumb = "/photography/thumbs/freshers-night.jpg"
image = "/photography/full/freshers-night.jpg"
title = "新程之夜"
date = "2026-08-29"
location = "华中科技大学，武汉"
camera = "Sony ILCE-6400"
alt = "夜色中的华中科技大学迎新展板，后方是一座被灯光照亮的雕像。"
description = """新生把名字放进夜风，旗帜却先替明天举手。校门外的路还未熟，脚步已学会把陌生唱成同行。"""
details = """画面把迎新展板放在近处，并以一条向上倾斜的橙色边框切入画幅，先建立了明确的行动方向。上方被灯光打亮的雕像，以垂直的身姿和抬起的手构成庄重的视觉支点；其后的楼宇、树影和夜色则退成深暗的背景。紫蓝色展板与橙色框架之间形成清醒的冷暖对照，白色雕像又把目光重新提向高处。

于是这不只是迎新现场的记录：前景的文字、远处的人像和空出的夜空，将刚刚启程的兴奋安放进秩序感很强的校园空间。画面同时保留了现场的热闹与夜晚的安静，让“新程”成为一条由近到远、由低到高展开的视觉路线。"""

[[items]]
id = "jianghan-guan-night"
thumb = "/photography/thumbs/jianghan-guan-night.jpg"
image = "/photography/full/jianghan-guan-night.jpg"
title = "江汉关的蓝光"
date = "2026-08-29"
location = "江汉关，武汉"
camera = "Sony ILCE-6400"
alt = "夜色中的江汉关钟楼，背景是蓝色灯光勾勒的高楼。"
description = """钟面替江城守夜，蓝光把高楼写成未寄出的信。若时间肯回头一秒，谁会在钟声里认出旧的自己。"""
details = """低机位让钟楼从画面左侧向上生长，古典建筑厚重的石材、拱券与发光钟面，被置于高楼的蓝色线性灯光之前。两种垂直节奏彼此呼应：钟楼的轮廓稳而缓，背后建筑的蓝光则更锋利、更密集。画面右侧保留了大块近乎纯黑的夜空，使明亮主体不至于拥挤，也让时间感有了停顿的余地。

金色与蓝色并置得很克制，既提示出城市新旧尺度的并存，也让这座钟楼在夜里显得像一枚安静、清晰的坐标。钟面本身是最直接的亮点，而周围向上延伸的灯带则把视线继续推往更高处，使历史建筑和当代天际线共享同一段夜色。"""

[[items]]
id = "corridor-afterglow"
thumb = "/photography/thumbs/corridor-afterglow.jpg"
image = "/photography/full/corridor-afterglow.jpg"
title = "走廊留住余晖"
date = "2026-08-25"
location = "华中科技大学物理学院，武汉"
camera = "Sony ILCE-6400"
alt = "低机位拍摄的昏暗室内走廊，尽头的玻璃门映出阳光和树影，地面有清晰倒影。"
description = """走廊把黄昏收进地面，门外的树影还未肯散场。我在倒影里借一盏光，照见今天没有说完的话。"""
details = """这张竖幅将走廊的纵深压得很长：顶棚、两侧墙面和栏杆不断向尽头收束，把视线准确地送往玻璃门后的光。室内维持低照度，门外的夕阳却透过玻璃、绿叶与朦胧反光层层漫开，形成温暖而不刺目的中心。地面的倒影几乎复制了门窗的结构，使画面像多出一段向下延伸的空间。

暗处的门框、座椅和日常物件保留了环境的质地，避免了画面滑向单纯的光影练习。冷静的室内秩序与门外流动的金色相遇，让空无一人的走廊仍带着刚刚有人经过般的温度；光被框在门后，却又借由倒影慢慢铺回观看者脚下。"""

[[items]]
id = "suspension-bridge-twilight"
thumb = "/photography/thumbs/suspension-bridge-twilight.jpg"
image = "/photography/full/suspension-bridge-twilight.jpg"
title = "江天欲暮"
date = "2026-07-05"
location = "武昌湾公园，武汉 · 杨泗港长江大桥"
camera = "Sony ILCE-6400"
lens = "Sony E 18-135mm F3.5-5.6 OSS"
alt = "晚霞中的红色悬索桥桥塔，前景有虚化的花朵，远处是江对岸的高楼。"
description = """桥塔把晚霞吊在半空，远楼把沉默站成彼岸。河风经过，城市便把一天慢慢收线。"""
details = """桥塔被置于画面偏左的位置，竖直的结构与两侧舒展的悬索共同搭起清晰骨架；细密的吊索反复划过晚霞，使天空不只是背景，也成为节奏的一部分。前景虚化的花朵没有抢占主体，却像一层柔软的帷幕，给钢铁结构加入了近距离的呼吸。

粉橙色云层、桥身的暖红与远处渐暗的城市剪影逐层递进，水面把桥塔和楼群再次压低、拉长。画面因此同时拥有工程结构的力量和黄昏的轻盈，情绪并不热烈，却有一种城市将要慢慢安静下来的从容。"""

[[items]]
id = "bridges-across-river"
thumb = "/photography/thumbs/bridges-across-river.jpg"
image = "/photography/full/bridges-across-river.jpg"
title = "层桥向晚"
date = "2026-07-05"
location = "武昌湾公园，武汉 · 杨泗港长江大桥"
camera = "Sony ILCE-6400"
lens = "Sony E 18-135mm F3.5-5.6 OSS"
alt = "两座桥横跨宽阔江面，远处城市高楼的玻璃窗映出暖色阳光。"
description = """两道桥把江面分成前后，夕阳在远楼的玻璃里留下短暂的金。我们隔着钢索望向彼此，像把重逢排练成远景。"""
details = """这张照片没有把单一桥梁作为绝对主角，而是用多重水平结构组织辽阔的江面。上方悬索的弧线斜跨天空，中部的桥面承接车辆与行人的细小节奏，下方另一座桥又把城市天际线切出新的层次；水面则为这些线条留出安静的呼吸空间。

远处高楼的玻璃反射出一小片金光，成为偏冷、偏灰画面里最精确的亮点。不同高度、不同尺度的桥和楼彼此叠合，照片呈现的不是热闹的城市全景，而是一段被交通、河流与光线共同编排的空间关系。"""

[[items]]
id = "sunset-behind-railings"
thumb = "/photography/thumbs/sunset-behind-railings.jpg"
image = "/photography/full/sunset-behind-railings.jpg"
title = "栏杆后的落日"
date = "2026-07-05"
camera = "Sony ILCE-6400"
lens = "Sony E 18-135mm F3.5-5.6 OSS"
alt = "横向栏杆后的落日和城市天际线，前景有逆光的玫瑰。"
description = """栏杆把日落切成几段，玫瑰在阴影里仍学着发亮。城市不肯停下，却容许一朵花把傍晚留住。"""
details = """横向栏杆在这里并非单纯的遮挡，而是主动的画面语言。它们将天空、城市和水面切成数个平行的层次，使低处的玫瑰与远处的楼群被纳入同一套节奏。逆光中的太阳接近画面中央，强烈的白光压低了建筑细节，却把栏杆、花枝和地面投下的阴影勾得更清楚。

暖光从缝隙间穿出，既有被限制的意味，也让平常的城市边界显得格外有戏剧性。花朵在前景保持柔软，远景则趋于剪影，画面最终留下的是短暂、明亮而略带阻隔感的傍晚。"""

[[items]]
id = "rose-before-sunset"
thumb = "/photography/thumbs/rose-before-sunset.jpg"
image = "/photography/full/rose-before-sunset.jpg"
title = "暮色栖花"
date = "2026-07-05"
location = "武昌湾公园，武汉"
camera = "Sony ILCE-6400"
lens = "Sony E 18-135mm F3.5-5.6 OSS"
alt = "栏杆边的一朵蜜桃色玫瑰，背景是虚化的低阳和城市天际线。"
description = """日光越过栏杆时，玫瑰替天空保管最后一点红。远楼没有回答，风已把花瓣写成告别。"""
details = """这张作品将一朵玫瑰安放在右下角，让它面对大面积被逆光洗亮的天空与模糊城市。画面主体并不只在花上，而在花、栏杆与光之间形成的尺度反差：近处的花瓣保留了温暖的边缘，远处楼群却被压成柔和的深色块，横向栏杆从中穿过，替画面建立起稳定的节拍。

高亮区域几乎吞没了天空的细节，却让光线具有一种接近记忆的朦胧感。于是玫瑰不显得孤立，反而像是在繁复城市之前留下的一点近景情绪，轻而不弱；栏杆的重复线条也让这种细小的情绪有了可以停靠的结构。"""

[[items]]
id = "bay-after-dark"
thumb = "/photography/thumbs/bay-after-dark.jpg"
image = "/photography/full/bay-after-dark.jpg"
title = "灯火泊湾"
date = "2026-07-02"
location = "烟台渔人码头，烟台"
camera = "Sony ILCE-6400"
lens = "Sony E 18-135mm F3.5-5.6 OSS"
alt = "蓝调时刻的弧形海滨步道，栏杆亮起灯光，远处海湾和建筑灯火相映。"
description = """夜色沿海湾慢慢合拢，灯光在石岸排成一条回家的线。我们不说再见，只让潮声替城市继续说下去。"""
details = """弧形步道从右下方出发，沿着海岸把视线带向远处亮起灯火的建筑群，是画面最明确的引导线。左侧海面保持深暗而开阔，右侧的栏杆、步道和树影则不断收紧空间，两者共同形成开与合的平衡。岸线灯光被连续地拉成暖色曲线，与仍带蓝意的天空和水面相互映照。

零星行人的尺度让长长的步道不显空置，建筑的尖顶与远处高楼在夜色中起伏。照片既有散步时的亲近感，也保留了海湾面对城市时的辽阔；光线沿岸延伸，像把观看者缓慢带进画面深处。"""

[[items]]
id = "harbor-lights"
thumb = "/photography/thumbs/harbor-lights.jpg"
image = "/photography/full/harbor-lights.jpg"
title = "海岸灯火"
date = "2026-07-02"
camera = "Sony ILCE-6400"
lens = "Sony E 18-135mm F3.5-5.6 OSS"
alt = "蓝调时刻水边一组亮灯的尖顶建筑，海面映出淡淡的灯光。"
description = """屋顶像未读完的童话，灯火把海面叫醒。当蓝色降到最低，我们把远方误认成一盏门灯。"""
details = """建筑群被安排在画面中下部，密集的尖顶、屋脊和窗灯组成起伏而清晰的轮廓；深蓝色天幕留出足够空间，使灯火显得更集中。海岸边一条连续的暖光带横向展开，将建筑、水面和前景的暗色礁石连接起来。

水中的倒影没有被处理得过分平滑，而是随着水面微小起伏被拉开、打散，为静止的建筑添入柔和的流动。冷色夜幕与金色灯光之间保持着克制的距离，画面因此不像单纯的夜景陈列，更像一段由岸线、波光与屋顶共同构成的安静舞台。"""

[[items]]
id = "seawall-blue-hour"
thumb = "/photography/thumbs/seawall-blue-hour.jpg"
image = "/photography/full/seawall-blue-hour.jpg"
title = "石堤浸晚"
date = "2026-07-02"
location = "烟台海岸线，烟台"
camera = "Sony ILCE-6400"
lens = "Sony E 18-135mm F3.5-5.6 OSS"
alt = "蓝调时刻的石砌海堤，人们站在暖色灯光照亮的栏杆旁，远处可见对岸。"
description = """石墙把海风挡在身后，金色在边缘替暮色点灯。有人停在栏边，像等一个名字从浪里回来。"""
details = """竖幅构图把大片天空和海面交给冷蓝色，石砌海堤则从右下方斜向伸出，成为连接近处礁石、栏杆与远方岸线的主要力量。堤岸粗粝的石块、潮湿的礁石与栏杆上细密的暖光形成质感对照：前者沉稳而有重量，后者轻而连续，像沿边缘缓慢移动的光线。

栏边的人物被压缩得很小，却恰好给出尺度，使空阔海面不显空洞。远处城市在薄雾中变得模糊，画面最动人的地方正在于这种边界感：陆地尚未结束，夜色却已经从海上先一步抵达。"""

[[items]]
id = "misty-shore"
thumb = "/photography/thumbs/misty-shore.jpg"
image = "/photography/full/misty-shore.jpg"
title = "雾岸"
date = "2026-07-02"
location = "烟台大学，烟台"
camera = "Sony ILCE-6400"
lens = "Sony E 18-135mm F3.5-5.6 OSS"
alt = "一名持伞者站在海水边缘，面向有雾的海面，远处隐约可见海上建筑。"
description = """雾把远岸藏得太好，海却替每个离开的人保留波纹。一把伞站在浪前，像不肯说破的等候。"""
details = """这张竖幅以极大的留白建立情绪。天空、雾气与海面几乎连成同一层低饱和的蓝灰，地平线被弱化，远处的平台与船只只留下若隐若现的轮廓。人物被放在画面右下方的浅水边缘，伞面和深色衣裙成为整幅照片最明确、也最安静的视觉锚点。

她与辽阔水面之间没有戏剧性的动作，正因如此，尺度差距显得格外真实：近处是一人、一把伞和细小波纹，远处则是难以辨清的海。画面把雾的遮蔽转化为一种温和的沉默，让观看停留得更久。"""

[[items]]
id = "wuchang-bay-blue-hour"
thumb = "/photography/thumbs/dsc00113.jpg"
image = "/photography/full/dsc00113.jpg"
title = "武昌湾蓝调"
date = "2026-06-19"
location = "武昌湾公园，武汉"
camera = "Sony ILCE-6400"
lens = "导出 JPEG 未保留镜头 EXIF"
alt = "蓝调夜色中，鹦鹉洲长江大桥亮起橙金灯光，江面映出城市灯火，前景有暗色树叶。"
description = """这张照片的层次铺陈十分清晰：近处的树叶以近乎剪影的方式压入画面，像一层安静的前景帷幕；中景的鹦鹉洲长江大桥则以温暖的灯光横贯江面，成为画面的视觉骨架；更远处，另一座桥与城市天际线隐入深蓝的夜色之中，使空间被自然地拉开。画面因此不是平铺的夜景，而是由前景、中景、远景共同构成的一种有纵深的舞台。

最动人的地方在于冷暖关系的克制。蓝调时刻已接近尾声，天空与江面都沉入深而静的冷蓝色之中，而桥塔和桥身的橙金色灯光恰好在其中点亮一条温暖的脉络。这种冷暖对比并不激烈，却很有呼吸感：暖色没有撕破夜色，冷色也没有吞没城市，二者在江面上达到一种含蓄的平衡。

水面的倒影尤其丰富。桥灯、塔身与城市灯火被江水拉长、揉碎，形成细密而流动的光纹，为画面增加了柔软的节奏。但这些倒影并不喧宾夺主，它们只是让静止的桥与城市拥有了水的回声，使整个画面在沉静中带着微微的流动感。

远处的城市天际线和天边几朵云彩，则给这片深蓝色的夜景留下了明亮而透气的出口。它们让画面不至于过分沉重，也使视觉重心从桥梁延展到更辽阔的城市空间。整体来看，这张照片既有蓝调末期的深沉，也有江城夜色特有的温柔光泽：它不是热闹的城市明信片，而是一幅安静、克制、层次分明的江面夜景。"""

